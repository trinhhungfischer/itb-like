<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanguard</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a24;
        overflow: hidden;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #pixi-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #battle-hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="pixi-canvas"></div>
      <div id="battle-hud">
        <div id="zone-a" class="hud-panel">
          <div class="turn-text">Turn 1</div>
          <div class="phase-text">Planning</div>
        </div>
        
        <div id="zone-b" class="hud-panel">
          <div class="objective-label">Objective</div>
          <div class="objective-value">Survive 5 Turns</div>
        </div>
        
        <div id="zone-e" class="hud-panel">
          <button id="end-turn-btn" class="primary-button">End Turn</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
