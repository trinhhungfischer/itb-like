    gdd: design/gdd/encounter-generator.md
    requirement: "Canonical source of the mulberry32_prng algorithm; encounterSeed(attemptIndex)=mix(runSeed, nodeId, templateId, attemptIndex); pinned reference test-vector table so re-implementations stay bit-exact (Open Q1)."
