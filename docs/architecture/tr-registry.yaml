  # ── Run Persistence (design/gdd/run-persistence.md) ─────────────────────────
  - id: TR-PERSIST-001
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "{schemaVersion, checksum, data} envelope in localStorage under two independent, independently-versioned domains (vanguard.meta.v{N}, vanguard.run.v{N}) so a failure in one can't take down the other."
    adr: "ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-002
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Pinned deterministic order-sensitive uint32 checksum (F2 weighted sum, checksum(\"AB\")=197) computed over the serialized data string only; frozen (algorithm change requires a schema bump) (Open Q1)."
    adr: "ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-003
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Build-then-swap atomic writes (single setItem of a fully-built string; never clear/truncate before the replacement is ready) so a failed/interrupted write leaves the previous good save byte-identical."
    adr: "ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-004
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Four load outcomes per domain (Empty | Valid | Corrupted(quarantine) | Unsupported(newer, left untouched)); per-domain sequential migration (migrate_vN_to_vN+1, F3) with post-migration validation; a newer-than-code save is never overwritten by a lower-version write."
    adr: "ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-005
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Stores only runSeed (immutable) + nodeId + reproducible map/roster state, never a generated encounter; resume re-derives the byte-identical encounter via generateEncounter(runSeed, nodeId, ...) (relies on mulberry32 determinism)."
    adr: "ADR-0004, ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-006
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Result-vs-throw error contract (Open Q2): loadRun/saveRun model expected outcomes as returned result values (no throw for expected states); adopts the shared convention pinned by the Board/Combat error contract."
    adr: "ADR-0005, ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-007
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "localStorage capability probe at boot → memory-only mode when disabled; QuotaExceeded retry-once-after-pruning-quarantine; run-end ordering merges unlocks into Meta before clearing Run Save; single run slot in v1."
    adr: "ADR-0003"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PERSIST-008
    system: Run Persistence
    gdd: design/gdd/run-persistence.md
    requirement: "Save granularity is node-map level only; mid-battle state (turn #, hazards, HP, undo stack) lives only in memory — true mid-battle resume is out of v1 scope (would need a serializeBattleState/restoreBattleState contract)."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active

  # ── Encounter Generator (design/gdd/encounter-generator.md) ─────────────────
  - id: TR-ENCGEN-001
    system: Encounter Generator
    gdd: design/gdd/encounter-generator.md
    requirement: "generateEncounter(runSeed, nodeId, difficultyConfig, rosterSnapshot) → EncounterDefinition is pure and reproducible (Rule 14): identical inputs → byte-identical output, no wall-clock, no non-seeded randomness."
