    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENCGEN-004
    system: Encounter Generator
    gdd: design/gdd/encounter-generator.md
    requirement: "Difficulty Tiers is the sole direct caller of generateEncounter (interface inversion, C1); Encounter Generator never calls into Difficulty Tiers — keeps the Feature-layer call graph acyclic."
    adr: "ADR-0010"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENCGEN-005
    system: Encounter Generator
    gdd: design/gdd/encounter-generator.md
    requirement: "Authors initial hazards via Combat's spawnHazard and writes initial terrain / spawn-point / objective / deploy-zone flags to Board at battle setup (Board only stores/validates)."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENCGEN-006
    system: Encounter Generator
    gdd: design/gdd/encounter-generator.md
    requirement: "Headless Turn & Phase Manager instantiation contract for the solver (Open Q2): how a simulated Player Phase submits actions programmatically and how search-branch state is torn down without leaking into the real manager instance — not yet pinned by an ADR."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active

