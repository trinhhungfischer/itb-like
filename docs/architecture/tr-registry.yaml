# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a GDD requirement is removed: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by.
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories, /story-done, /story-readiness
#
# ID FORMAT: TR-<SYSTEM>-NNN   (SYSTEM = short uppercase slug; NNN zero-padded per system)
# STATUS VALUES: active | deprecated | superseded-by: TR-<SYSTEM>-NNN
#
# `adr` field: the ADR(s) that architecturally cover this requirement, or ""
#   when the requirement is design-level / presentation-only (no ADR needed —
#   see requirements-traceability.md for coverage rationale).

version: 1
last_updated: "2026-07-28"

requirements:

  # ── Board & Grid (design/gdd/board-and-grid.md) ─────────────────────────────
  - id: TR-BOARD-001
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Finite W×H grid (default 8×8), integer (col,row) coords, 4-directional adjacency, Manhattan distance; one-occupant-per-tile invariant; terrain/occupancy/hazard/flag state model exposed via a pure read-only query API (inBounds, getTile, isOccupied, getOccupant, isBlocked, getHazard, hasFlag, neighbors, distance, tilesInRange, step, classify, rayTiles, snapshot)."
    adr: "ADR-0001"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-002
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Tile state stored as parallel flat typed arrays (index(c,r)=r*W+c) so snapshot() is a bulk memcpy < 1 ms/call on ≤12×12 (highest-risk op); O(1) queries avg < 0.01 ms/call; snapshot is a fully independent copy (no shared refs)."
    adr: "ADR-0001"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-003
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Board owns the single canonical bounded flood-fill reachableTiles(origin,range,board) (Formula 9, resolves C3) over Clear tiles, excludes origin, deterministic, runs identically on live board or snapshot() — no second BFS anywhere."
    adr: "ADR-0009"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-004
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Rejected-mutation error contract (Open Q1): expected gameplay rejections (place on occupied) return a Result; programmer errors (W<1 construction, OOB tilesInRange origin, R<0) assert/throw."
    adr: "ADR-0005"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-005
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Board mutations (place, clear, setTerrain, setHazard, setFlag) are deterministic and invoked ONLY via Combat Resolution; the board holds no randomness and no time-dependence."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-006
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Runtime terrain mutation (hero-built walls): setTerrain(tile, Blocked/Normal) generalizes destroy(); classify() reads mutated terrain so every range/push/move check respects a hero wall with no query-model change."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-BOARD-007
    system: Board & Grid
    gdd: design/gdd/board-and-grid.md
    requirement: "Determinism: identical mutation sequences on two identically-constructed boards reach byte-identical state (no hidden RNG/time); classify precedence OutOfBounds→BlockedTerrain→Lethal→Occupied→Clear."
    adr: "ADR-0001"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Turn & Phase Manager (design/gdd/turn-and-phase-manager.md) ─────────────
  - id: TR-TURN-001
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "Fixed per-turn phase order TurnStart→PlayerPhase→Environment→EnemyResolve→Spawn→Telegraph→EndCheck, identical every turn, no reordering; Environment resolves BEFORE EnemyResolve (deliberate tactical setup/disruption)."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-002
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "In-phase undo/redo implemented by adopting a prior Board snapshot() as the live board (no board-owned restore()); snapshot captured at Player-Phase start and after each action's full consequence chain (incl. on-death spawnUnit); stack cleared on Commit, bounding memory to one phase (~74 KB on 8×8)."
    adr: "ADR-0007, ADR-0001"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-003
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "Interface inversion: the manager drives Combat/Enemy/Objective via abstract contracts (resolve, resolveTelegraphed, emergeSpawns, chooseIntents, evaluate) rather than concrete implementations, keeping the dependency graph acyclic (Open Q1)."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-004
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "Deterministic and input-driven: only Player-Phase input is nondeterministic; every other phase is a pure function of board state (no timers, no wall-clock, no RNG in phase logic)."
    adr: "ADR-0004, ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-005
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "Emits phase events (turn_started, player_phase_begun, action_applied, action_undone, environment_resolved, hazard_ticked, enemy_action_resolved, enemy_spawned, intents_telegraphed, battle_ended) on the synchronous event bus."
    adr: "ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-006
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "battle_ended event carries nodeType (Battle/Elite/Boss) for terminal consumers; exactly one battle_ended fires per battle."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-007
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "At most 4 Objective.evaluate(battleState,turn,config) calls per turn (3 early lose-only checks + 1 terminal win/lose check); early checks act on Defeat only."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-TURN-008
    system: Turn & Phase Manager
    gdd: design/gdd/turn-and-phase-manager.md
    requirement: "Undo memory bounded to one Player Phase via full-board snapshots (delta/command undo not warranted at this scale, F3)."
    adr: "ADR-0007, ADR-0001"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Combat Resolution (design/gdd/combat-resolution.md) ─────────────────────
  - id: TR-COMBAT-001
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "resolve(board, effects[]) → events[] is the single, exclusive board-mutation path; pure w.r.t. inputs (no RNG, no wall-clock); determinism (not immutability) is the contract."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-002
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Closed 10-primitive vocabulary (damage, push, pull, swap, spawnHazard, applyHazard, removeUnit, setTerrain, spawnUnit + shared collision-resolution algorithm); no 11th primitive without amending combat-resolution.md, the registry, and the ADR."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-003
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Effects apply strictly sequentially (state after effect i is input to i+1); chain never aborts partway; a primitive targeting an already-removed unit is a logged no-op; target-locking by unit ID / tile, snapshotted once before the chain."
    adr: "ADR-0006, ADR-0005"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-004
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Emits only the canonical event vocabulary (DamageApplied, DisplacementComplete, CollisionResolved, SwapComplete, HazardSpawned, HazardApplied, UnitRemoved, TerrainSet, UnitSpawned); no push_resolved/apply() entry point; events are the sole integration surface for Rendering/HUD/Audio/Preview, delivered over the synchronous bus."
    adr: "ADR-0002, ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-005
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "spawnUnit is the single board-mutation path for adding a unit (emergence + on-death broods) and rejects a non-Clear tile as a no-op; removeUnit is the single exit point and is idempotent."
    adr: "ADR-0006, ADR-0005"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-006
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "hazardImmunities is consulted at every hazard damage site (applyHazard primitive + hazard-on-entry after displacement/spawn); an immune unit takes no damage and emits no HazardApplied event."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-007
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Programmer-error assertions: damage with amount < 0 and pull with no explicit direction assert/throw (not silently clamped); gameplay rejections (spawnUnit/setTerrain/swap) return a Result and emit a debug event without aborting the chain."
    adr: "ADR-0005"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-008
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Move Preview reuses the exact resolve() entry point over board.snapshot() (not a parallel reimplementation); the same effect list is used for preview and commit."
    adr: "ADR-0007, ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-COMBAT-009
    system: Combat Resolution
    gdd: design/gdd/combat-resolution.md
    requirement: "Event-log wire schema (field names, versioning) pinning (Open Q1) — the canonical event vocabulary is settled; field-level schema is not yet fully pinned."
    adr: "ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Heroes & Abilities (design/gdd/heroes-and-abilities.md) ─────────────────
  - id: TR-HERO-001
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "Owns and publishes the canonical per-battle Unit record (registry unit_record): {id, team, archetype, maxHP, currentHP, position, size=1, abilities[], hazardImmunities[], statusFlags[]} — team not faction, maxHP/currentHP not hp; referenced (never re-shaped) by Enemy/Objective/Upgrades/Draft."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-002
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "Owns the shared AbilityDefinition schema {shape, targetFilter, effectTemplate, compileEffects()} reused verbatim by Enemy; each effectTemplate step compiles into one of the 10 Combat primitives."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-003
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "legalMoveTiles(origin, moveRange, board) is a pass-through to Board.reachableTiles (F1, resolves C3) — no second BFS; targets recomputed from the hero's current (post-move) position at selection time."
    adr: "ADR-0009"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-004
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "compileEffects(caster, ability, selectedTarget) is pure and deterministic and produces the exact EffectPrimitive[] that BOTH Move Preview's dry-run and the committed action run — no separate preview description."
    adr: "ADR-0006, ADR-0007"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-005
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "hazardImmunities is a first-class Unit field (empty in v1 base kit) threaded through Combat's hazard call sites."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-006
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "push/pull-carrying abilities must supply a well-defined orthogonal direction at cast time (Combat never infers it) via target-then-direction (range-1 UnitTarget), direction-then-target (Line), or requiresOrthogonalAlignment."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-007
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "Action economy: squad_size=3 heroes, actions_per_hero_turn=2 (one Move slot + one Ability slot), registry constants consumed by Turn Manager F2; slot bookkeeping rolls back in lockstep with the undo snapshot."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-HERO-008
    system: Heroes & Abilities
    gdd: design/gdd/heroes-and-abilities.md
    requirement: "Presentation contract: silhouette-first hero identity, one accent color per verb-family, legal-move / legal-target highlight sets distinct from hazard/telegraph overlays, explicit direction choice for Line abilities."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active

  # ── Enemy, Abilities & Telegraph (design/gdd/enemy-abilities-and-telegraph.md) ─
  - id: TR-ENEMY-001
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Reuses the shared AbilityDefinition schema verbatim and compiles enemy actions + on-death effects to the 10 Combat primitives (never mutates the board directly — keeps Enemy↔Combat acyclic); reads the shared Unit record for enemy units and living-hero targeting."
    adr: "ADR-0006, ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-002
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Deterministic target-selection AI (Nearest-Threat, ties broken by lowest unitId, no fallback); zero in-battle RNG; resolution + telegraph processed in ascending unitId order (F4)."
    adr: "ADR-0004"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-003
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Movement-to-range consumes Board.reachableTiles (F2, resolves C3); enemy destination-selection policy is layered on top of the shared reachable set — no second BFS."
    adr: "ADR-0009"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-004
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Per-enemy Intent {telegraphedMoveDestination, telegraphedEffectTiles, abilityId} computed once at chooseIntents (Telegraph Phase), fixed for the following Player Phase; telegraphed actions resolve against the fixed tile set, not chasing the unit."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-005
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Owns the environmental telegraph query surface telegraphedEnvironmentTiles(turn) and telegraphedLethalThreatCount(turn) (Rule 17, resolves C4) — a thin pass-through over Board hazard state + a pure lethality tally over the shared Unit record; computed at Telegraph Phase, fixed for the turn."
    adr: "ADR-0011"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-006
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Spawn emergence and on-death broods go through Combat's spawnUnit primitive on a Clear tile; forced-emergence eviction rules; first-turn inactivity (one-turn telegraph guarantee)."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-007
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "On-death cascade: onDeath follow-up resolve() calls execute after the triggering chain returns and fully resolve BEFORE Turn Manager captures the post-action undo snapshot (satisfies contracts §3)."
    adr: "ADR-0007"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-ENEMY-008
    system: Enemy, Abilities & Telegraph
    gdd: design/gdd/enemy-abilities-and-telegraph.md
    requirement: "Implements the three deterministic phase-contract methods the Turn Manager drives: chooseIntents(), resolveTelegraphed(), emergeSpawns()."
    adr: "ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Move Preview (design/gdd/move-preview.md) ───────────────────────────────
  - id: TR-PREVIEW-001
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Dry-runs the identical Combat resolve() entry point over board.snapshot(); Preview-Commit Parity Invariant holds unconditionally (deterministic sim, single-player, no async mutation) — never a parallel/approximate predictor."
    adr: "ADR-0007, ADR-0006"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PREVIEW-002
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Silent and subscription-based: subscribes to Input & Selection's hover/select/cancel/confirm events; dry-run events NEVER reach the shared event stream Audio/Rendering/HUD consume (silence is the boundary — no committed tag needed)."
    adr: "ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PREVIEW-003
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Snapshots the live board on every hover; t_preview = t_snapshot + t_resolve + t_diff ≤ 5 ms, with t_snapshot < 1 ms inherited from Board's cheap snapshot."
    adr: "ADR-0001, ADR-0007"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PREVIEW-004
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Threat overlay unions telegraphedEnvironmentTiles(turn) with per-enemy Intent.telegraphedEffectTiles by the identical contract Battle HUD uses (F3, C4) — both read, never re-derive."
    adr: "ADR-0011"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PREVIEW-005
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Gameplay rejections must be observable as values so a dry-run over a snapshot never throws for a merely-illegal move (preview overlay never crashed)."
    adr: "ADR-0005"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-PREVIEW-006
    system: Move Preview
    gdd: design/gdd/move-preview.md
    requirement: "Preview never pushes to the undo stack; the disposable preview board is discarded after read; the live board is byte-identical before/after a preview compute."
    adr: "ADR-0007"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Objective / Win-Lose (design/gdd/objective-and-win-lose.md) ─────────────
  - id: TR-OBJECTIVE-001
    system: Objective / Win-Lose
    gdd: design/gdd/objective-and-win-lose.md
    requirement: "evaluate(battleState, turn, config) → {ongoing, victory, defeat} is pure, side-effect-free, state-poll (no event subscription), idempotent, callable multiple times per turn."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-OBJECTIVE-002
    system: Objective / Win-Lose
    gdd: design/gdd/objective-and-win-lose.md
    requirement: "battleState.units reads the canonical Unit record (team/maxHP/currentHP; a unit is alive iff it has a live record on the board) — corrects the earlier faction/hp/alive phrasing."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-OBJECTIVE-003
    system: Objective / Win-Lose
    gdd: design/gdd/objective-and-win-lose.md
    requirement: "Defeat precedence over Victory enforced inside evaluate(); universal party-wipe lose predicate applies to every objective type; owns max_turns and the four types (Survive/Protect/Clear/Reach)."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-OBJECTIVE-004
    system: Objective / Win-Lose
    gdd: design/gdd/objective-and-win-lose.md
    requirement: "Deterministic, no RNG, no memory between calls; turn<1 and malformed config are programmer/authoring errors rejected upstream, not runtime branches."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-OBJECTIVE-005
    system: Objective / Win-Lose
    gdd: design/gdd/objective-and-win-lose.md
    requirement: "EvaluationResult carries a non-authoritative reason code for HUD/telemetry; the terminal status is surfaced to Run Structure via Turn Manager's battle_ended event, not a direct call."
    adr: "ADR-0008"
    created: 2026-07-28
    revised: ""
    status: active

  # ── Input & Selection (design/gdd/input-and-selection.md) ───────────────────
  - id: TR-INPUT-001
    system: Input & Selection
    gdd: design/gdd/input-and-selection.md
    requirement: "screen↔tile coordinate transform (screenToTile / tileToScreenCenter) uses the single shared coordinate-transform module both Input and Board Rendering import (resolves the coordinate half of C3) — round-trip identity, rounding pinned once."
    adr: "ADR-0009"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-INPUT-002
    system: Input & Selection
    gdd: design/gdd/input-and-selection.md
    requirement: "Silent event emitter: emits hover/select/cancel/confirm events that Move Preview subscribes to; never calls a synchronous preview() and never reads a preview result back."
    adr: "ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-INPUT-003
    system: Input & Selection
    gdd: design/gdd/input-and-selection.md
    requirement: "Locked state gates on PlayerPhase AND Board Rendering's isAnimating() (polled direct boolean, contracts §7); input buffer depth 1 with legality re-check on unlock; every input does something visible or is visibly rejected."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-INPUT-004
    system: Input & Selection
    gdd: design/gdd/input-and-selection.md
    requirement: "Queries Heroes' legalMoveTiles/legalTargets for highlight sets and reads slot state off the shared Unit record — never computes legality/reachability itself."
    adr: "ADR-0009"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-INPUT-005
    system: Input & Selection
    gdd: design/gdd/input-and-selection.md
    requirement: "Deterministic Tab-cycle order (board-index, position-derived); full keyboard-only operability; presentation cues non-color-reliant (accessibility)."
    adr: ""
    created: 2026-07-28
    revised: ""
    status: active

  # ── Board Rendering & Juice (design/gdd/board-rendering-and-juice.md) ───────
  - id: TR-RENDER-001
    system: Board Rendering & Juice
    gdd: design/gdd/board-rendering-and-juice.md
    requirement: "Pure PixiJS view layer: read-only consumer of Board queries + Combat's canonical event log; never mutates Board/Combat/Turn state; the simulation core never depends on it (P3)."
    adr: "ADR-0002"
    created: 2026-07-28
    revised: ""
    status: active
  - id: TR-RENDER-002
