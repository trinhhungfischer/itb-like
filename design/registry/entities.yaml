# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: manhattan_distance
    status: active
    source: design/gdd/board-and-grid.md
    referenced_by:
      - design/gdd/board-and-grid.md
    variables:
      - a
      - b
    output_range: [0, 14]
    expression: "|a.col - b.col| + |a.row - b.row|"
    notes: "Grid distance metric (4-directional / Manhattan). Max is W+H-2 (14 on
      the default 8x8 board). Used by movement range, ability targeting, and all
      range checks. Movement/push are orthogonal-only by design."
    added: 2026-07-27
    revised: ""
  - name: mulberry32_prng
    status: active
    source: design/gdd/encounter-generator.md
    referenced_by:
      - design/gdd/encounter-generator.md
      - design/gdd/run-structure-node-map.md
      - design/gdd/draft-and-loadout-meta.md
    variables:
      - seed
    output_range: [0, 1]
    expression: "mulberry32(seed) PRNG stream + mix() 32-bit hash combiner"
    notes: "Shared deterministic PRNG for PROCEDURAL GENERATION ONLY (map/encounter/draft),
      NEVER for in-battle resolution (battles stay fully deterministic, no RNG). Each
      consumer supplies its own salt constant as a parameter; the algorithm is identical
      and must NOT be re-derived per document."
    added: 2026-07-27
    revised: ""

